# Linux host networking intentionally shares 127.0.0.1 with the host browser,
# so Atlassian can redirect to mcp-remote's OAuth callback in the container.
x-common: &common
  build:
    context: .
  image: chatgpt-mcp-tunnel:local
  network_mode: host
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=32m
  volumes:
    - oauth-data:/home/node/.mcp-auth
  environment:
    MCP_REMOTE_CONFIG_DIR: /home/node/.mcp-auth

services:
  auth:
    <<: *common
    profiles:
      - auth
    entrypoint: ["mcp-remote-client"]
    command:
      - "https://mcp.atlassian.com/v2/mcp"
      - "${OAUTH_CALLBACK_PORT:-38677}"
      - "--transport"
      - "http-only"
      - "--host"
      - "localhost"
      - "--auth-timeout"
      - "180"

  tunnel:
    <<: *common
    restart: unless-stopped
    environment:
      MCP_REMOTE_CONFIG_DIR: /home/node/.mcp-auth
      CONTROL_PLANE_API_KEY: "${CONTROL_PLANE_API_KEY:?Set CONTROL_PLANE_API_KEY in .env}"
      CONTROL_PLANE_TUNNEL_ID: "${CONTROL_PLANE_TUNNEL_ID:?Set CONTROL_PLANE_TUNNEL_ID in .env}"
      MCP_COMMAND: "mcp-remote https://mcp.atlassian.com/v2/mcp ${OAUTH_CALLBACK_PORT:-38677} --transport http-only --host localhost --auth-timeout 180"
      HEALTH_LISTEN_ADDR: "127.0.0.1:18080"
    # /healthz is only liveness; it returns 200 even when the control plane
    # is degraded (e.g. TLS certificate errors). Require observed poll success.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          (async () => {
            const base = 'http://127.0.0.1:18080';
            const options = {signal: AbortSignal.timeout(4000)};
            const ready = await fetch(base + '/readyz', options);
            const response = await fetch(base + '/health/control-plane', options);
            const control = await response.json();
            process.exit(ready.ok && response.ok && control.status === 'ok' ? 0 : 1);
          })().catch(() => process.exit(1));
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  oauth-data:
