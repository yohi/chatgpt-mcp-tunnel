services:
  filesystem-tunnel:
    build:
      context: .
      dockerfile: Dockerfile.filesystem
    image: chatgpt-filesystem-mcp-tunnel:local
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    volumes:
      - type: bind
        source: ${FILESYSTEM_HOST_PATH:?Set FILESYSTEM_HOST_PATH in .env.filesystem}
        target: /projects
        read_only: true
    environment:
      CONTROL_PLANE_API_KEY: ${FILESYSTEM_CONTROL_PLANE_API_KEY:?Set FILESYSTEM_CONTROL_PLANE_API_KEY in .env.filesystem}
      CONTROL_PLANE_TUNNEL_ID: ${FILESYSTEM_CONTROL_PLANE_TUNNEL_ID:?Set FILESYSTEM_CONTROL_PLANE_TUNNEL_ID in .env.filesystem}
      FILESYSTEM_HOST_PATH: ${FILESYSTEM_HOST_PATH:?Set FILESYSTEM_HOST_PATH in .env.filesystem}
      MCP_COMMAND: mcp-server-filesystem /projects
      HEALTH_LISTEN_ADDR: 127.0.0.1:18082
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          (async () => {
            const base = 'http://127.0.0.1:18082';
            const options = {signal: AbortSignal.timeout(4000)};
            const ready = await fetch(base + '/readyz', options);
            const response = await fetch(base + '/health/control-plane', options);
            const control = await response.json();
            process.exit(ready.ok && response.ok && control.status === 'ok' ? 0 : 1);
          })().catch(() => process.exit(1));
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
