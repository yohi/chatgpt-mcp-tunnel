name: Docker build
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        env:
          CONTROL_PLANE_API_KEY: placeholder-ci-key
          CONTROL_PLANE_TUNNEL_ID: tunnel_placeholder
        run: docker compose --profile auth config --quiet
      - name: Validate optional CA override
        env:
          CONTROL_PLANE_API_KEY: placeholder-ci-key
          CONTROL_PLANE_TUNNEL_ID: tunnel_placeholder
        run: docker compose -f compose.yaml -f compose.override.example.yaml --profile auth config --quiet
      - name: Build image (no credentials)
        run: docker build --pull --tag chatgpt-mcp-tunnel:ci .
      - name: Smoke-test image and CA trust bundle
        run: |
          docker run --rm --entrypoint sh chatgpt-mcp-tunnel:ci -ec '
            test -s /etc/ssl/certs/ca-certificates.crt
            command -v tunnel-client
            command -v mcp-remote
            command -v mcp-remote-client
            tunnel-client --version
          '
      - name: Validate AWS Compose files (no AWS credentials)
        run: |
          docker compose --env-file .env.aws.example -f compose.aws.yaml --profile aws-auth config --quiet
          docker compose --env-file .env.aws.example -f compose.aws.yaml -f compose.aws.ca.example.yaml --profile aws-auth config --quiet
      - name: Verify AWS detailed health is internal-only
        run: |
          docker compose --env-file .env.aws.example -f compose.aws.yaml config --format json \
            | python3 -c '
          import json
          import sys
          config = json.load(sys.stdin)
          tunnel = config["services"]["aws-tunnel"]
          assert not tunnel.get("ports"), "AWS health port must not be published"
          assert tunnel["environment"]["HEALTH_LISTEN_ADDR"] == "127.0.0.1:18081"
          assert tunnel.get("network_mode") != "host"
          print("AWS health is internal-only; no published ports")
          '
      - name: Verify isolated STS role volumes and tools (offline)
        env:
          AWS_MCP_READ_ROLE_ARN: arn:aws:iam::123456789012:role/ChatGPTMcpReadOnlyRole
        run: |
          docker compose --env-file .env.aws.example \
            -f compose.aws.yaml -f compose.aws.api-tools.example.yaml \
            --profile aws-role-init config --quiet
          python3 - <<'PY'
          import json
          import shlex
          import subprocess

          cmd = ["docker", "compose", "--env-file", ".env.aws.example"]
          base = json.loads(subprocess.check_output(
              [*cmd, "-f", "compose.aws.yaml", "config", "--format", "json"], text=True
          ))
          optin = json.loads(subprocess.check_output(
              [*cmd, "-f", "compose.aws.yaml",
               "-f", "compose.aws.api-tools.example.yaml",
               "config", "--format", "json"], text=True
          ))
          original = base["services"]["aws-tunnel"]
          expanded = optin["services"]["aws-tunnel"]
          source = optin["services"]["aws-credential-broker"]
          baseline_volumes = {x["target"] for x in original["volumes"]}
          role_volumes = {x["target"] for x in expanded["volumes"]}
          broker_volumes = {x["target"] for x in source["volumes"]}
          assert "/home/awsuser/.aws" in baseline_volumes
          assert "/home/awsuser/.aws" not in role_volumes, "ADMIN login cache leaked to MCP"
          assert role_volumes == {"/run/aws-mcp-credentials"}, "Unexpected MCP mount"
          assert next(x for x in expanded["volumes"] if x["target"] == "/run/aws-mcp-credentials")["read_only"]
          assert broker_volumes == {"/home/awsuser/.aws", "/run/aws-mcp-credentials"}
          assert expanded["environment"]["AWS_PROFILE"] == "aws-mcp-sts-readonly"
          assert expanded["environment"]["AWS_CONFIG_FILE"] == "/etc/aws-mcp/config"
          assert expanded["environment"]["AWS_SHARED_CREDENTIALS_FILE"] == "/dev/null"
          assert source["environment"]["AWS_PROFILE"] == "aws-mcp-readonly"
          default_args = shlex.split(original["environment"]["MCP_COMMAND"])
          role_args = shlex.split(expanded["environment"]["MCP_COMMAND"])
          assert default_args[-1] == "--read-only"
          assert "--read-only" not in role_args
          assert "--profile" in role_args
          assert role_args[role_args.index("--profile") + 1] == "aws-mcp-sts-readonly"
          assert not expanded.get("ports")
          assert expanded["depends_on"]["aws-credential-broker"]["condition"] == "service_healthy"
          print("Admin login cache isolated from MCP; role-only STS mount confirmed")
          PY
      - name: Check AWS official Docker Hub CLI image
        run: |
          docker pull amazon/aws-cli:2.37.12
          docker run --rm amazon/aws-cli:2.37.12 --version
          docker run --rm amazon/aws-cli:2.37.12 login help > /dev/null
      - name: Build AWS SigV4 proxy image
        run: |
          docker tag chatgpt-mcp-tunnel:ci chatgpt-mcp-tunnel:local
          docker build -f Dockerfile.aws --tag chatgpt-aws-mcp-tunnel:ci .
      - name: Smoke-test AWS image (no credentials)
        run: |
          docker run --rm --entrypoint sh chatgpt-aws-mcp-tunnel:ci -ec '
            test -s /etc/ssl/certs/ca-certificates.crt
            command -v tunnel-client
            command -v mcp-proxy-for-aws-cli
            python -c "import mcp_proxy_for_aws"
            python -c "import boto3, awscrt; print(boto3.__version__); assert tuple(map(int, boto3.__version__.split(chr(46))[:2])) >= (1, 41)"
            tunnel-client --version
            python -m ast /usr/local/bin/aws-tunnel-healthcheck.py >/dev/null
            python -m ast /usr/local/bin/aws-mcp-credential-broker.py >/dev/null
            python -m ast /usr/local/bin/aws-mcp-credential-process.py >/dev/null
            test -s /etc/aws-mcp/config
          '
      - name: Integration-test AWS SSO volume ownership (offline)
        env:
          COMPOSE_PROJECT_NAME: aws-sso-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker tag chatgpt-aws-mcp-tunnel:ci chatgpt-aws-mcp-tunnel:local
          # Test the actual Compose one-shot helper with CAP_CHOWN only.
          # It must work when the cached SSO directory is private (0700).
          docker compose --env-file .env.aws.example -f compose.aws.yaml \
            run --rm --no-deps aws-sso-init
          docker compose --env-file .env.aws.example -f compose.aws.yaml \
            run --rm --no-deps --entrypoint sh aws-tunnel \
            -c 'test -w /home/awsuser/.aws && touch /home/awsuser/.aws/.ci-probe && rm /home/awsuser/.aws/.ci-probe'
          # Clean up only this unique, CI-owned volume (never user credentials).
          docker volume rm "${COMPOSE_PROJECT_NAME}_aws-sso-data"
      - name: Offline STS role process tests in AWS image
        run: |
          docker run --rm --entrypoint python \
            -v "${PWD}/tests:/tests:ro" \
            chatgpt-aws-mcp-tunnel:ci \
            -m unittest discover -s /tests -p test_aws_sts_isolation.py -v
      - name: Integration-test role-only credential volume ownership (offline)
        env:
          AWS_MCP_READ_ROLE_ARN: arn:aws:iam::123456789012:role/ChatGPTMcpReadOnlyRole
          COMPOSE_PROJECT_NAME: aws-role-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker tag chatgpt-aws-mcp-tunnel:ci chatgpt-aws-mcp-tunnel:local
          docker compose --env-file .env.aws.example \
            -f compose.aws.yaml -f compose.aws.api-tools.example.yaml \
            run --rm --no-deps aws-role-init
          docker compose --env-file .env.aws.example \
            -f compose.aws.yaml -f compose.aws.api-tools.example.yaml \
            run --rm --no-deps --entrypoint python aws-tunnel \
            -c 'import os, pathlib; p=pathlib.Path("/run/aws-mcp-credentials"); assert p.is_dir(); assert not os.access(p, os.W_OK); assert not pathlib.Path("/home/awsuser/.aws/config").exists()'
          docker compose --env-file .env.aws.example \
            -f compose.aws.yaml -f compose.aws.api-tools.example.yaml \
            run --rm --no-deps --entrypoint python aws-credential-broker \
            -c 'from pathlib import Path; p=Path("/run/aws-mcp-credentials"); assert p.is_dir() and p.stat().st_uid == 10001; p.joinpath(".ci-probe").write_text("ok"); p.joinpath(".ci-probe").unlink()'
          docker volume rm "${COMPOSE_PROJECT_NAME}_aws-mcp-role-credentials"
      - name: Ensure local-only override stays ignored
        run: |
          touch compose.override.yaml .env.aws
          git check-ignore -q compose.override.yaml
          git check-ignore -q .env.aws
          git check-ignore -q .env.aws.example && exit 1 || true
          ! git ls-files --error-unmatch compose.override.yaml 2>/dev/null
          ! git ls-files --error-unmatch .env.aws 2>/dev/null
