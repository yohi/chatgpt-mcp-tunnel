name: Docker build
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        env:
          CONTROL_PLANE_API_KEY: placeholder-ci-key
          CONTROL_PLANE_TUNNEL_ID: tunnel_placeholder
        run: docker compose --profile auth config --quiet
      - name: Validate optional CA override
        env:
          CONTROL_PLANE_API_KEY: placeholder-ci-key
          CONTROL_PLANE_TUNNEL_ID: tunnel_placeholder
        run: docker compose -f compose.yaml -f compose.override.example.yaml --profile auth config --quiet
      - name: Build image (no credentials)
        run: docker build --pull --tag chatgpt-mcp-tunnel:ci .
      - name: Smoke-test image and CA trust bundle
        run: |
          docker run --rm --entrypoint sh chatgpt-mcp-tunnel:ci -ec '
            test -s /etc/ssl/certs/ca-certificates.crt
            command -v tunnel-client
            command -v mcp-remote
            command -v mcp-remote-client
            tunnel-client --version
          '
      - name: Validate AWS Compose files (no AWS credentials)
        run: |
          docker compose --env-file .env.aws.example -f compose.aws.yaml --profile aws-auth config --quiet
          docker compose --env-file .env.aws.example -f compose.aws.yaml -f compose.aws.ca.example.yaml --profile aws-auth config --quiet
      - name: Check AWS official Docker Hub CLI image
        run: |
          docker pull amazon/aws-cli:2.37.12
          docker run --rm amazon/aws-cli:2.37.12 --version
          docker run --rm amazon/aws-cli:2.37.12 login help > /dev/null
      - name: Build AWS SigV4 proxy image
        run: |
          docker tag chatgpt-mcp-tunnel:ci chatgpt-mcp-tunnel:local
          docker build -f Dockerfile.aws --tag chatgpt-aws-mcp-tunnel:ci .
      - name: Smoke-test AWS image (no credentials)
        run: |
          docker run --rm --entrypoint sh chatgpt-aws-mcp-tunnel:ci -ec '
            test -s /etc/ssl/certs/ca-certificates.crt
            command -v tunnel-client
            command -v mcp-proxy-for-aws-cli
            python -c "import mcp_proxy_for_aws"
            python -c "import boto3, awscrt; print(boto3.__version__); assert tuple(map(int, boto3.__version__.split(chr(46))[:2])) >= (1, 41)"
            tunnel-client --version
            python -m ast /usr/local/bin/aws-tunnel-healthcheck.py >/dev/null
          '
      - name: Integration-test AWS SSO volume ownership (offline)
        env:
          COMPOSE_PROJECT_NAME: aws-sso-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker tag chatgpt-aws-mcp-tunnel:ci chatgpt-aws-mcp-tunnel:local
          # Test the actual Compose one-shot helper with CAP_CHOWN only.
          # It must work when the cached SSO directory is private (0700).
          docker compose --env-file .env.aws.example -f compose.aws.yaml \
            run --rm --no-deps aws-sso-init
          docker compose --env-file .env.aws.example -f compose.aws.yaml \
            run --rm --no-deps --entrypoint sh aws-tunnel \
            -c 'test -w /home/awsuser/.aws && touch /home/awsuser/.aws/.ci-probe && rm /home/awsuser/.aws/.ci-probe'
          # Clean up only this unique, CI-owned volume (never user credentials).
          docker volume rm "${COMPOSE_PROJECT_NAME}_aws-sso-data"
      - name: Ensure local-only override stays ignored
        run: |
          touch compose.override.yaml .env.aws
          git check-ignore -q compose.override.yaml
          git check-ignore -q .env.aws
          git check-ignore -q .env.aws.example && exit 1 || true
          ! git ls-files --error-unmatch compose.override.yaml 2>/dev/null
          ! git ls-files --error-unmatch .env.aws 2>/dev/null
