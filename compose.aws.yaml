# Independent AWS connection: no Atlassian volume, no host-network mode,
# and no ChatGPT plugin/app integration. Console login uses an AWS CLI helper container.
# Supply .env.aws with --env-file; do not pass the Atlassian .env file.
services:
  aws-tunnel:
    build:
      context: .
      dockerfile: Dockerfile.aws
    image: chatgpt-aws-mcp-tunnel:local
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    # No published health port. Detailed /health/* endpoints require a
    # *container-internal* loopback peer; Docker port forwarding receives 403.
    # Inspect them with "docker compose exec -T aws-tunnel python ...".
    # AWS MCP traffic itself is outbound over HTTPS.
    volumes:
      - aws-sso-data:/home/awsuser/.aws
    environment:
      HOME: /home/awsuser
      AWS_CONFIG_FILE: /home/awsuser/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /home/awsuser/.aws/credentials
      AWS_PROFILE: aws-mcp-readonly
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      AWS_REGION: "${AWS_MCP_ENDPOINT_REGION:-ap-northeast-1}"
      AWS_DEFAULT_REGION: "${AWS_MCP_ENDPOINT_REGION:-ap-northeast-1}"
      CONTROL_PLANE_API_KEY: "${AWS_CONTROL_PLANE_API_KEY:?Set AWS_CONTROL_PLANE_API_KEY in .env.aws}"
      CONTROL_PLANE_TUNNEL_ID: "${AWS_CONTROL_PLANE_TUNNEL_ID:?Set AWS_CONTROL_PLANE_TUNNEL_ID in .env.aws}"
      HEALTH_LISTEN_ADDR: "127.0.0.1:18081"
      MCP_COMMAND: >-
        mcp-proxy-for-aws-cli
        https://aws-mcp.${AWS_MCP_ENDPOINT_REGION:-ap-northeast-1}.api.aws/mcp
        --service aws-mcp
        --region ${AWS_MCP_ENDPOINT_REGION:-ap-northeast-1}
        --profile aws-mcp-readonly
        --metadata AWS_REGION=${AWS_MCP_TARGET_REGION:-ap-northeast-1}
        --read-only
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/aws-tunnel-healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  aws-auth:
    # AWS CLI v2 published by AWS on Docker Hub (ECR Public can rate-limit).
    # Override AWS_CLI_IMAGE in .env.aws to use a trusted mirror.
    # Identical UID/GID and HOME share *only* the AWS credential cache volume.
    image: "${AWS_CLI_IMAGE:-amazon/aws-cli:2.37.12}"
    profiles:
      - aws-auth
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    volumes:
      - aws-sso-data:/home/awsuser/.aws
    environment:
      HOME: /home/awsuser
      AWS_CONFIG_FILE: /home/awsuser/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /home/awsuser/.aws/credentials
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      AWS_REGION: "${AWS_MCP_ENDPOINT_REGION:-ap-northeast-1}"
      AWS_DEFAULT_REGION: "${AWS_MCP_ENDPOINT_REGION:-ap-northeast-1}"

  aws-role-bootstrap:
    # Opt-in, one-shot IAM role provisioning using the EXISTING aws login cache.
    # Does not run with the AWS Tunnel or automatically create IAM resources.
    # Dry run by default: docker compose --env-file .env.aws -f compose.aws.yaml
    #   run --rm --no-deps aws-role-bootstrap
    # Explicit mutation: append --apply.
    image: chatgpt-aws-mcp-tunnel:local
    profiles:
      - aws-bootstrap
    user: "10001:10001"
    entrypoint: ["python", "/usr/local/bin/aws-mcp-bootstrap-role.py"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    volumes:
      - aws-sso-data:/home/awsuser/.aws
      - aws-mcp-role-credentials:/run/aws-mcp-credentials
    environment:
      HOME: /home/awsuser
      AWS_CONFIG_FILE: /home/awsuser/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /home/awsuser/.aws/credentials
      AWS_PROFILE: aws-mcp-readonly
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      AWS_REGION: "${AWS_MCP_ENDPOINT_REGION:-ap-northeast-1}"
      AWS_DEFAULT_REGION: "${AWS_MCP_ENDPOINT_REGION:-ap-northeast-1}"

  aws-sso-init:
    # Legacy service name (kept to preserve documented commands); one-shot
    # ownership repair for the credential cache volume created by an earlier
    # failed image pull or created before the non-root AWS runtime initialized.
    # Only CHOWN is granted. Avoid recursive traversal of mode-0700 volumes:
    # root without DAC_OVERRIDE/DAC_READ_SEARCH cannot enumerate them.
    # The only action is to repair ownership of the mounted directory itself.
    image: chatgpt-aws-mcp-tunnel:local
    profiles:
      - aws-init
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "chown 10001:10001 /home/awsuser/.aws"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    volumes:
      - aws-sso-data:/home/awsuser/.aws

volumes:
  aws-mcp-role-credentials:
  aws-sso-data:
